# Supabase free projects pause after 7 days without API activity. This pings the REST API daily.
# Repo secrets required: SUPABASE_URL (https://<ref>.supabase.co) and SUPABASE_KEY (publishable/anon key).
name: supabase-keepalive
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl --fail --silent --show-error --retry 3 \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/user_docs?select=id&limit=1"
