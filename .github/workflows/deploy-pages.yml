# Builds the app and publishes it to GitHub Pages (https://<user>.github.io/langtutor/).
# The ~34 MB dictionary bundle is not in git: it is a release asset (tag `data-latest`, file `bundle.json`)
# that this job downloads into app/public/data/ before building. See docs/DEPLOY.md.
name: deploy-pages
on:
  push:
    branches: [master]
    paths: ['app/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Download the dictionary bundle (release asset)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download data-latest --pattern bundle.json --dir app/public/data
      - name: Build
        env:
          VITE_BASE: /langtutor/
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_KEY }}
        run: npm run build
      - name: SPA fallback (deep links like /langtutor/word/casa)
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
